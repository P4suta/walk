[tools]
godot = "4.7.2-stable"
rust = "1.100.0"
python = "3.15.2"
uv = "0.13.8"
lefthook = "2.2.2"
zizmor = "1.32.0"
gitleaks = "8.30.1"
"pipx:gdtoolkit" = { version = "4.5.0", uvx_args = "--python 3.14.10" }
jactionlint = { version = "2.6.0", workflow = "release.yaml" }

[tasks.play]
description = "Play Walk"
run = "godot --path ."

[tasks.editor]
description = "Open the editable project"
run = "godot --editor --path ."

[tasks.format]
description = "Format owned GDScript"
run = ["gdformat scripts tests", "cargo fmt --manifest-path tools/Cargo.toml"]

[tasks.lint]
description = "Check GDScript formatting and style"
run = ["gdformat --check scripts tests", "gdlint scripts tests"]

[tasks.typecheck]
description = "Import and compile the project with Godot"
run = "cargo run --locked --manifest-path tools/Cargo.toml -- typecheck"

[tasks.test]
description = "Run deterministic game and interface tests"
run = "godot --headless --path . --script addons/gut/gut_cmdln.gd -gexit"

[tasks.prepare-rust-checks]
description = "Install the Rust verification components"
run = "rustup component add rustfmt clippy"

[tasks.check]
description = "Check formatting, types, content, and behavior"
run = [
  "cargo fmt --manifest-path tools/Cargo.toml --check",
  "cargo clippy --locked --manifest-path tools/Cargo.toml --all-targets -- -D warnings",
  "cargo test --locked --manifest-path tools/Cargo.toml",
  "mise run ci-lint",
  "mise run lint",
  "mise run typecheck",
  "mise run test",
  "cargo run --locked --manifest-path tools/Cargo.toml -- fixtures",
]

[tasks.ci-lint]
description = "Validate the hosted workflow"
run = [
  "jactionlint .github/workflows/check.yml",
  "zizmor --offline .github/workflows/check.yml",
]

[tasks.secrets]
description = "Check committed source for secrets"
run = "gitleaks git --redact --no-banner"

[tasks.secrets-staged]
description = "Check staged source for secrets"
run = "gitleaks git --pre-commit --staged --redact --no-banner"

[tasks.export-windows]
description = "Export the Windows desktop package"
run = [
  "mkdir -p build/windows",
  "godot --headless --path . --export-release Windows build/windows/Walk.exe",
]

[tasks.export-macos]
description = "Export the universal macOS application"
run = [
  "mkdir -p build/macos",
  "godot --headless --path . --export-release macOS build/macos/Walk.zip",
]

[tasks.export-linux]
description = "Export the Linux desktop package"
run = [
  "mkdir -p build/linux",
  "godot --headless --path . --export-release Linux build/linux/Walk.x86_64",
]

[tasks.export]
description = "Check and export all desktop packages"
run = [
  "mise run check",
  "mise run export-windows",
  "mise run export-macos",
  "mise run export-linux",
  "cargo run --locked --manifest-path tools/Cargo.toml -- package",
]

[tasks.smoke]
description = "Exercise the game through native input and the complete route"
run = "godot --path . -- --smoke-test"

[tasks.gallery]
description = "Capture every region and panel from the real renderer"
run = "godot --path . -- --smoke-test --capture-gallery"
